<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bautizo de José Antonio</title>
  <meta name="description" content="Invitación al bautizo de José Antonio — 27 de junio de 2026, Parroquia Villa de Guadalupe." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="hero">
    <div class="hero-doves">
      <span class="dove">🕊️</span>
      <h1>José Antonio</h1>
      <span class="dove">🕊️</span>
    </div>
    <p class="hero-subtitle">¡Nos bautizamos! Acompáñanos en este día tan especial.</p>
    <p class="hero-date">27 de junio de 2026</p>
  </header>

  <main class="gallery">

    <!-- Imagen 1: Detalles del evento -->
    <section class="card">
      <img src="images/1-detalles.jpeg" alt="Detalles del bautizo: 27 de junio de 2026, 11 AM, Villa de Guadalupe, fiesta en Margaritas Cholul 1:30 PM" />
    </section>

    <!-- Imagen 2: Padres y padrinos -->
    <section class="card">
      <img src="images/2-padres-padrinos.jpeg" alt="Padres y padrinos de José Antonio" />
    </section>

    <!-- Imagen 3: Mesa de regalos / datos bancarios -->
    <section class="card">
      <img src="images/3-regalo.jpeg" alt="Información para regalos y transferencia" />
    </section>

    <!-- Imagen 4: Ubicación -->
    <section class="card">
      <img src="images/4-ubicacion.jpeg" alt="Ubicación: Parroquia Villa de Guadalupe" />
      <a class="map-button" href="https://maps.app.goo.gl/aAjHkaVdNgmKJgLk0?g_st=iw" target="_blank" rel="noopener">
        📍 Ver ubicación en el mapa
      </a>
    </section>

  </main>

  <footer class="footer">
    <p>Con cariño, <strong>Familia Farah Cervera</strong></p>
  </footer>

</body>
</html>
